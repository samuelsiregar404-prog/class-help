<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CLASS-HELP | Portal Pelaporan Fasilitas Kampus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="login-card">
    <h1>🎓 CLASS-HELP</h1>
    <p>Portal Pelaporan Fasilitas Kampus</p>

    <input id="email" type="email" placeholder="Email Kampus">
    <input id="password" type="password" placeholder="Kata Sandi">

    <button class="btn blue" type="button" onclick="login('student')">
      Login Mahasiswa
    </button>

    <button class="btn yellow" type="button" onclick="login('technician')">
      Login Teknisi
    </button>

    <div class="login-links">
      <span onclick="openRegister()">Daftar Akun</span> •
      <span onclick="openForgot()">Lupa Password?</span>
    </div>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal hidden">
  <div class="modal-card">
    <h3>📝 Registrasi Akun</h3>
    <input type="text" placeholder="Nama Lengkap">
    <input type="email" placeholder="Email Kampus">
    <input type="password" placeholder="Kata Sandi">
    <button class="btn blue" type="button" onclick="closeRegister()">
      Daftar
    </button>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgotModal" class="modal hidden">
  <div class="modal-card">
    <h3>🔑 Lupa Password</h3>
    <input type="email" placeholder="Masukkan email terdaftar">
    <button class="btn yellow" type="button" onclick="closeForgot()">
      Kirim Reset
    </button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="header">
    <h2 id="title">Dashboard</h2>
    <button class="btn red" type="button" onclick="logout()">
      Logout
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div id="menu"></div>
    </aside>

    <main id="content"></main>
  </div>
</div>

<!-- SCRIPT HARUS PALING BAWAH -->
<script src="app.js"></script>

</body>
</html>
