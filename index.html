<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CLASS-HELP | Portal Pelaporan Fasilitas Kampus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="login-card">
    <h1>🎓 CLASS-HELP</h1>
    <p>Portal Pelaporan Fasilitas Kampus</p>

    <input id="email" type="email" placeholder="Email Kampus">
    <input id="password" type="password" placeholder="Kata Sandi">

    <button class="btn blue" onclick="login('student')">Login Mahasiswa</button>
    <button class="btn yellow" onclick="login('technician')">Login Teknisi</button>

    <div class="login-links">
      <span onclick="openRegister()">Daftar Akun</span> •
      <span onclick="openForgot()">Lupa Password?</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="header">
    <h2 id="title">Dashboard</h2>
    <button class="btn red" onclick="logout()">Logout</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="menu"></div>
    <main id="content"></main>
  </div>
</div>

<!-- MODAL REGISTER -->
<div id="registerModal" class="modal hidden">
  <div class="modal-card">
    <h3>📝 Registrasi Akun</h3>
    <input placeholder="Nama Lengkap">
    <input placeholder="Email Kampus">
    <input type="password" placeholder="Kata Sandi">
    <button class="btn blue" onclick="closeRegister()">Daftar</button>
  </div>
</div>

<!-- MODAL FORGOT -->
<div id="forgotModal" class="modal hidden">
  <div class="modal-card">
    <h3>🔑 Lupa Password</h3>
    <input placeholder="Masukkan email terdaftar">
    <button class="btn yellow" onclick="closeForgot()">Kirim Reset</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
